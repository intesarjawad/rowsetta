name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small public or synthetic example.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include the project version, OS, Python and browser versions.
    validations:
      required: true
