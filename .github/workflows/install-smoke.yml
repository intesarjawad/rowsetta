# Runs each README install line on a clean runner, with no cache, and waits for the app.
name: install-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            install: brew install uv
            demo: uvx rowsetta@0.1.0 demo --no-browser --port 8787
          - os: ubuntu-latest
            install: curl -LsSf https://astral.sh/uv/install.sh | sh
            demo: uvx --torch-backend cpu rowsetta@0.1.0 demo --no-browser --port 8787
          - os: windows-latest
            install: powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
            demo: uvx --torch-backend cpu rowsetta@0.1.0 demo --no-browser --port 8787
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Both uv installers add their directory to GITHUB_PATH for the next steps.
      - run: ${{ matrix.install }}
      - name: Start the demo and wait for it to answer
        run: |
          ${{ matrix.demo }} &
          for _ in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8787/health; then exit 0; fi
            sleep 5
          done
          echo "error: the demo did not answer on /health within 15 minutes" >&2
          exit 1
