name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # hatch_build.py builds the interface into the wheel.
      - run: uv build
      - run: unzip -l dist/*.whl | grep -q rowsetta/static/index.html
      - run: uv publish --trusted-publishing always
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --notes "$(python3 scripts/changelog_section.py "$GITHUB_REF_NAME")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release made with GITHUB_TOKEN starts no other workflow, so the site is deployed here.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
