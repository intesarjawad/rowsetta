# Catches upstream drift in the teacher: weights, tabicl or torch changing what the model answers.
name: monthly-smoke
on:
  schedule:
    # The 1st of each month; cron ORs day-of-month with day-of-week, so "first Monday" is not expressible.
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: tabicl-v2-20260212-4dcd344
      - run: uv sync --locked
      - run: uv run --locked python scripts/fetch_model.py
      - run: uv run --locked pytest -m model
        env:
          ROWSETTA_RUN_MODEL: "1"
      - run: uv run --locked python scripts/bench_teacher.py --device cpu --dataset penguins
      # Exits 1 when penguins accuracy moves more than 0.02 from docs/bench.json.
      - run: uv run --locked python scripts/check_drift.py
      - if: failure()
        run: >-
          gh issue create
          --title "Monthly model smoke failed on $(date -u +%F)"
          --body "The model download, model tests or drift check failed: $RUN_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
