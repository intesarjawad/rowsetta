repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: prettier
        name: prettier
        entry: pnpm --dir frontend format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|ts|svelte)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
